<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Pomodoro Timer</title>
    <!-- Dumpling Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥟</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        pomodoro: {
                            focus: '#f43f5e',
                            short: '#10b981',
                            long: '#3b82f6',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        .progress-ring-circle {
            transition: stroke-dashoffset 0.35s ease-in-out, stroke 0.5s ease;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        .btn-hover-effect {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover-effect:hover {
            transform: translateY(-2px);
        }
        .btn-hover-effect:active {
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-neutral-900 text-neutral-100 min-h-screen flex flex-col justify-between items-center font-sans transition-colors duration-500 selection:bg-rose-500 selection:text-white p-4 sm:p-6">

    <header class="w-full max-w-xl flex justify-between items-center py-4">
        <div class="flex items-center space-x-2">
            <span>🥟</span>
            <span class="font-semibold tracking-wider text-sm uppercase text-neutral-400">PomoFocus</span>
        </div>
        <div class="flex items-center space-x-3">
            <!-- PiP Button -->
            <button id="pipBtn" title="Mini Floating Timer (Picture-in-Picture)" class="p-2.5 rounded-xl bg-neutral-800/80 hover:bg-neutral-700/80 text-neutral-300 hover:text-white border border-neutral-700/50 backdrop-blur-md btn-hover-effect flex items-center gap-1.5 text-xs font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h12a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-6a2 2 0 00-2-2h-8a2 2 0 00-2 2v6a2 2 0 002 2z" />
                </svg>
                <span class="hidden sm:inline">Floating Window</span>
            </button>
            
            <!-- Audio Toggle -->
            <button id="soundBtn" title="Toggle Sound" class="p-2.5 rounded-xl bg-neutral-800/80 hover:bg-neutral-700/80 text-neutral-300 hover:text-white border border-neutral-700/50 backdrop-blur-md btn-hover-effect">
                <svg id="soundOnIcon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                </svg>
                <svg id="soundOffIcon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
                </svg>
            </button>

            <!-- Theme Toggle -->
            <button id="themeBtn" title="Toggle Theme" class="p-2.5 rounded-xl bg-neutral-800/80 hover:bg-neutral-700/80 text-neutral-300 hover:text-white border border-neutral-700/50 backdrop-blur-md btn-hover-effect">
                <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
            </button>

            <!-- Settings Button -->
            <button id="settingsBtn" title="Settings" class="p-2.5 rounded-xl bg-neutral-800/80 hover:bg-neutral-700/80 text-neutral-300 hover:text-white border border-neutral-700/50 backdrop-blur-md btn-hover-effect">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center w-full max-w-xl my-auto">
        <!-- Mode Switcher Tabs -->
        <div class="flex p-1.5 bg-neutral-800/60 dark:bg-neutral-800/60 rounded-2xl border border-neutral-700/40 backdrop-blur-md mb-8 sm:mb-12 shadow-inner">
            <button id="modeFocus" class="mode-tab px-5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 bg-rose-500 text-white shadow-lg shadow-rose-500/20">Focus</button>
            <button id="modeShort" class="mode-tab px-5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 text-neutral-400 hover:text-white">Short Break</button>
            <button id="modeLong" class="mode-tab px-5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 text-neutral-400 hover:text-white">Long Break</button>
        </div>

        <!-- Circular Timer Container -->
        <div class="relative w-64 h-64 sm:w-80 sm:h-80 flex items-center justify-center">
            <svg class="w-full h-full transform -rotate-90" viewBox="0 0 240 240">
                <!-- Background Ring -->
                <circle cx="120" cy="120" r="105" stroke="currentColor" stroke-width="8" class="text-neutral-800 dark:text-neutral-800/80 fill-none" />
                <!-- Progress Ring -->
                <circle id="progressCircle" cx="120" cy="120" r="105" stroke="currentColor" stroke-width="8" stroke-dasharray="659.73" stroke-dashoffset="0" stroke-linecap="round" class="text-rose-500 fill-none progress-ring-circle" />
            </svg>

            <!-- Time Text & Status -->
            <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                <span id="timeDisplay" class="text-5xl sm:text-6xl font-bold tracking-tight text-neutral-100 font-mono">25:00</span>
                <span id="sessionStatus" class="mt-2 text-xs sm:text-sm font-medium tracking-widest uppercase text-neutral-400">Time to focus</span>
            </div>
        </div>

        <!-- Timer Controls -->
        <div class="flex items-center space-x-4 mt-8 sm:mt-12">
            <!-- Reset Button -->
            <button id="resetBtn" title="Reset Timer (R)" class="p-4 rounded-2xl bg-neutral-800/70 hover:bg-neutral-700/70 text-neutral-300 hover:text-white border border-neutral-700/50 backdrop-blur-md btn-hover-effect">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>

            <!-- Play/Pause Button -->
            <button id="startPauseBtn" class="px-8 py-4 rounded-2xl bg-rose-500 hover:bg-rose-600 text-white font-semibold shadow-lg shadow-rose-500/25 btn-hover-effect min-w-[140px] flex items-center justify-center gap-2">
                <svg id="playIcon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <svg id="pauseIcon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 fill-current hidden" viewBox="0 0 24 24">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
                <span id="startPauseText" class="text-base tracking-wide">START</span>
            </button>

            <!-- Skip Button -->
            <button id="skipBtn" title="Skip Session (S)" class="p-4 rounded-2xl bg-neutral-800/70 hover:bg-neutral-700/70 text-neutral-300 hover:text-white border border-neutral-700/50 backdrop-blur-md btn-hover-effect">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                </svg>
            </button>
        </div>

        <p class="text-xs text-neutral-500 mt-6 tracking-wide">Press <span class="px-1.5 py-0.5 rounded bg-neutral-800 border border-neutral-700 text-neutral-400 font-mono">Space</span> to start / pause</p>
    </main>

    <footer class="w-full max-w-xl text-center py-4 text-xs text-neutral-500">
        Minimalist Pomodoro Timer &bull; Floating Window Support Enabled
    </footer>

    <div id="settingsModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-neutral-900 dark:bg-neutral-900 border border-neutral-800 rounded-3xl p-6 sm:p-8 w-full max-w-md shadow-2xl transform scale-95 transition-transform duration-300">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold text-neutral-100">Timer Settings</h2>
                <button id="closeSettingsBtn" class="text-neutral-400 hover:text-white p-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- Settings Inputs -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-neutral-400 uppercase tracking-wider mb-2">Focus Duration (minutes)</label>
                    <input type="number" id="inputFocus" min="1" max="120" value="25" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-2.5 text-neutral-100 focus:outline-none focus:border-rose-500 font-mono text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-neutral-400 uppercase tracking-wider mb-2">Short Break Duration (minutes)</label>
                    <input type="number" id="inputShort" min="1" max="60" value="5" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-2.5 text-neutral-100 focus:outline-none focus:border-rose-500 font-mono text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-neutral-400 uppercase tracking-wider mb-2">Long Break Duration (minutes)</label>
                    <input type="number" id="inputLong" min="1" max="60" value="15" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-2.5 text-neutral-100 focus:outline-none focus:border-rose-500 font-mono text-sm">
                </div>
            </div>

            <div class="mt-8 flex justify-end">
                <button id="saveSettingsBtn" class="px-6 py-2.5 bg-rose-500 hover:bg-rose-600 text-white text-sm font-semibold rounded-xl shadow-lg shadow-rose-500/20 btn-hover-effect">
                    Save Changes
                </button>
            </div>
        </div>
    </div>

    <!-- Hidden Canvas & Video for fallback Picture-in-Picture mode -->
    <canvas id="pipCanvas" width="300" height="300" class="hidden"></canvas>
    <video id="pipVideo" autoplay muted class="hidden"></video>

    <script>
        // State
        const state = {
            durations: {
                focus: 25 * 60,
                short: 5 * 60,
                long: 15 * 60
            },
            currentMode: 'focus', // 'focus', 'short', 'long'
            timeLeft: 25 * 60,
            isRunning: false,
            soundEnabled: true,
            isDark: true,
            timerId: null,
            pipWindow: null,
            canvasCtx: null,
            videoStream: null
        };

        // DOM Elements
        const timeDisplay = document.getElementById('timeDisplay');
        const sessionStatus = document.getElementById('sessionStatus');
        const progressCircle = document.getElementById('progressCircle');
        const startPauseBtn = document.getElementById('startPauseBtn');
        const startPauseText = document.getElementById('startPauseText');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const resetBtn = document.getElementById('resetBtn');
        const skipBtn = document.getElementById('skipBtn');
        const pipBtn = document.getElementById('pipBtn');
        const soundBtn = document.getElementById('soundBtn');
        const soundOnIcon = document.getElementById('soundOnIcon');
        const soundOffIcon = document.getElementById('soundOffIcon');
        const themeBtn = document.getElementById('themeBtn');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const modeFocusBtn = document.getElementById('modeFocus');
        const modeShortBtn = document.getElementById('modeShort');
        const modeLongBtn = document.getElementById('modeLong');

        const inputFocus = document.getElementById('inputFocus');
        const inputShort = document.getElementById('inputShort');
        const inputLong = document.getElementById('inputLong');

        const pipCanvas = document.getElementById('pipCanvas');
        const pipVideo = document.getElementById('pipVideo');

        const RADIUS = 105;
        const CIRCUMFERENCE = 2 * Math.PI * RADIUS;

        // Sound generator using Web Audio API
        function playChime() {
            if (!state.soundEnabled) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                
                const now = ctx.currentTime;
                
                // Pleasant major chord chime
                const frequencies = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                frequencies.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + i * 0.1);
                    
                    gain.gain.setValueAtTime(0, now + i * 0.1);
                    gain.gain.linearRampToValueAtTime(0.15, now + i * 0.1 + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 1.2);
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    osc.start(now + i * 0.1);
                    osc.stop(now + i * 0.1 + 1.2);
                });
            } catch (e) {
                console.log("Audio play blocked or unsupported", e);
            }
        }

        // Initialize UI
        function init() {
            progressCircle.style.strokeDasharray = `${CIRCUMFERENCE} ${CIRCUMFERENCE}`;
            updateDisplay();
            setupEventListeners();
            initCanvas();
        }

        function initCanvas() {
            state.canvasCtx = pipCanvas.getContext('2d');
            renderCanvas();
        }

        function renderCanvas() {
            const ctx = state.canvasCtx;
            if (!ctx) return;

            const total = state.durations[state.currentMode];
            const progress = (total - state.timeLeft) / total;
            const minutes = String(Math.floor(state.timeLeft / 60)).padStart(2, '0');
            const seconds = String(state.timeLeft % 60).padStart(2, '0');

            // Draw Canvas Background
            ctx.fillStyle = state.isDark ? '#171717' : '#ffffff';
            ctx.fillRect(0, 0, 300, 300);

            // Ring Colors based on mode
            let color = '#f43f5e';
            if (state.currentMode === 'short') color = '#10b981';
            if (state.currentMode === 'long') color = '#3b82f6';

            // Base Ring
            ctx.beginPath();
            ctx.arc(150, 150, 110, 0, 2 * Math.PI);
            ctx.strokeStyle = state.isDark ? '#262626' : '#e5e5e5';
            ctx.lineWidth = 14;
            ctx.stroke();

            // Active Progress Arc
            ctx.beginPath();
            ctx.arc(150, 150, 110, -Math.PI / 2, (-Math.PI / 2) + (2 * Math.PI * progress));
            ctx.strokeStyle = color;
            ctx.lineWidth = 14;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Text Display
            ctx.fillStyle = state.isDark ? '#ffffff' : '#171717';
            ctx.font = 'bold 52px "Plus Jakarta Sans", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`${minutes}:${seconds}`, 150, 140);

            ctx.fillStyle = state.isDark ? '#a3a3a3' : '#737373';
            ctx.font = 'bold 16px "Plus Jakarta Sans", sans-serif';
            ctx.fillText(state.currentMode.toUpperCase(), 150, 190);

            // Update PiP window if Document PiP active
            if (state.pipWindow && state.pipWindow.document) {
                const pipTime = state.pipWindow.document.getElementById('pipTimeDisplay');
                const pipBar = state.pipWindow.document.getElementById('pipProgressBar');
                if (pipTime) pipTime.textContent = `${minutes}:${seconds}`;
                if (pipBar) pipBar.style.width = `${progress * 100}%`;
            }
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).padStart ? String(Math.floor(seconds / 60)).padStart(2, '0') : Math.floor(seconds / 60);
            const s = String(seconds % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateDisplay() {
            const timeStr = formatTime(state.timeLeft);
            timeDisplay.textContent = timeStr;

            // Update Page Title
            const modeName = state.currentMode === 'focus' ? 'Focus' : 'Break';
            document.title = `(${timeStr}) ${modeName} - PomoFocus`;

            // Update Circular Progress Bar
            const total = state.durations[state.currentMode];
            const offset = CIRCUMFERENCE - ((total - state.timeLeft) / total) * CIRCUMFERENCE;
            progressCircle.style.strokeDashoffset = offset;

            // Mode stroke colors
            if (state.currentMode === 'focus') {
                progressCircle.className.baseVal = 'text-rose-500 fill-none progress-ring-circle';
                startPauseBtn.className = startPauseBtn.className.replace(/bg-\w+-\d+/g, 'bg-rose-500').replace(/hover:bg-\w+-\d+/g, 'hover:bg-rose-600');
            } else if (state.currentMode === 'short') {
                progressCircle.className.baseVal = 'text-emerald-500 fill-none progress-ring-circle';
                startPauseBtn.className = startPauseBtn.className.replace(/bg-\w+-\d+/g, 'bg-emerald-500').replace(/hover:bg-\w+-\d+/g, 'hover:bg-emerald-600');
            } else {
                progressCircle.className.baseVal = 'text-blue-500 fill-none progress-ring-circle';
                startPauseBtn.className = startPauseBtn.className.replace(/bg-\w+-\d+/g, 'bg-blue-500').replace(/hover:bg-\w+-\d+/g, 'hover:bg-blue-600');
            }

            renderCanvas();
        }

        function switchMode(mode) {
            state.currentMode = mode;
            pauseTimer();
            state.timeLeft = state.durations[mode];

            // Tab Styling Updates
            [modeFocusBtn, modeShortBtn, modeLongBtn].forEach(btn => {
                btn.className = 'mode-tab px-5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 text-neutral-400 hover:text-white';
            });

            if (mode === 'focus') {
                modeFocusBtn.className = 'mode-tab px-5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 bg-rose-500 text-white shadow-lg shadow-rose-500/20';
                sessionStatus.textContent = "Time to focus";
            } else if (mode === 'short') {
                modeShortBtn.className = 'mode-tab px-5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 bg-emerald-500 text-white shadow-lg shadow-emerald-500/20';
                sessionStatus.textContent = "Time for a short break";
            } else {
                modeLongBtn.className = 'mode-tab px-5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 bg-blue-500 text-white shadow-lg shadow-blue-500/20';
                sessionStatus.textContent = "Time for a long break";
            }

            updateDisplay();
        }

        function startTimer() {
            if (state.isRunning) return;
            state.isRunning = true;
            startPauseText.textContent = "PAUSE";
            playIcon.classList.add('hidden');
            pauseIcon.classList.remove('hidden');

            state.timerId = setInterval(() => {
                if (state.timeLeft > 0) {
                    state.timeLeft--;
                    updateDisplay();
                } else {
                    playChime();
                    pauseTimer();
                    // Auto transition mode logic
                    if (state.currentMode === 'focus') {
                        switchMode('short');
                    } else {
                        switchMode('focus');
                    }
                }
            }, 1000);
        }

        function pauseTimer() {
            state.isRunning = false;
            startPauseText.textContent = "START";
            playIcon.classList.remove('hidden');
            pauseIcon.classList.add('hidden');
            if (state.timerId) {
                clearInterval(state.timerId);
                state.timerId = null;
            }
        }

        function toggleTimer() {
            if (state.isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function resetTimer() {
            pauseTimer();
            state.timeLeft = state.durations[state.currentMode];
            updateDisplay();
        }

        // Picture-in-Picture Handler
        async function togglePiP() {
            try {
                // Check if Document Picture-in-Picture API is available (Modern Chrome/Edge)
                if ('documentPictureInPicture' in window) {
                    if (state.pipWindow) {
                        state.pipWindow.close();
                        state.pipWindow = null;
                        return;
                    }

                    const pipWin = await window.documentPictureInPicture.requestWindow({
                        width: 260,
                        height: 180,
                    });

                    state.pipWindow = pipWin;

                    // Inject minimalist styles into PiP window
                    const style = pipWin.document.createElement('style');
                    style.textContent = `
                        body {
                            margin: 0;
                            padding: 16px;
                            background-color: #171717;
                            color: #f5f5f5;
                            font-family: system-ui, -apple-system, sans-serif;
                            display: flex;
                            flex-direction: column;
                            align-items: center;
                            justify-content: center;
                            height: 100vh;
                            box-sizing: border-box;
                            user-select: none;
                        }
                        .time { font-size: 42px; font-weight: 700; font-family: monospace; }
                        .mode { font-size: 11px; text-transform: uppercase; tracking-wider: 2px; color: #a3a3a3; margin-top: 2px; }
                        .progress-bar-bg { width: 100%; height: 6px; background: #262626; border-radius: 999px; margin-top: 14px; overflow: hidden; }
                        .progress-bar { height: 100%; background: #f43f5e; width: 0%; transition: width 0.3s; }
                    `;
                    pipWin.document.head.appendChild(style);

                    const minutes = String(Math.floor(state.timeLeft / 60)).padStart(2, '0');
                    const seconds = String(state.timeLeft % 60).padStart(2, '0');

                    pipWin.document.body.innerHTML = `
                        <div class="time" id="pipTimeDisplay">${minutes}:${seconds}</div>
                        <div class="mode">${state.currentMode} mode</div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar" id="pipProgressBar"></div>
                        </div>
                    `;

                    pipWin.addEventListener('unload', () => {
                        state.pipWindow = null;
                    });

                    updateDisplay();
                    return;
                }

                // Fallback to Canvas/Video Stream Picture-in-Picture
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else {
                    if (!state.videoStream) {
                        state.videoStream = pipCanvas.captureStream(30);
                        pipVideo.srcObject = state.videoStream;
                        await pipVideo.play();
                    }
                    await pipVideo.requestPictureInPicture();
                }
            } catch (err) {
                alert("Picture-in-Picture window couldn't be opened in this browser context.");
                console.error("PiP Error: ", err);
            }
        }

        // Setup DOM Listeners
        function setupEventListeners() {
            startPauseBtn.addEventListener('click', toggleTimer);
            resetBtn.addEventListener('click', resetTimer);
            skipBtn.addEventListener('click', () => {
                if (state.currentMode === 'focus') switchMode('short');
                else switchMode('focus');
            });

            modeFocusBtn.addEventListener('click', () => switchMode('focus'));
            modeShortBtn.addEventListener('click', () => switchMode('short'));
            modeLongBtn.addEventListener('click', () => switchMode('long'));

            pipBtn.addEventListener('click', togglePiP);

            // Sound Toggle
            soundBtn.addEventListener('click', () => {
                state.soundEnabled = !state.soundEnabled;
                soundOnIcon.classList.toggle('hidden', !state.soundEnabled);
                soundOffIcon.classList.toggle('hidden', state.soundEnabled);
            });

            // Theme Toggle
            themeBtn.addEventListener('click', () => {
                state.isDark = !state.isDark;
                document.documentElement.classList.toggle('dark', state.isDark);
                if (state.isDark) {
                    document.body.className = "bg-neutral-900 text-neutral-100 min-h-screen flex flex-col justify-between items-center font-sans transition-colors duration-500 selection:bg-rose-500 selection:text-white p-4 sm:p-6";
                } else {
                    document.body.className = "bg-neutral-100 text-neutral-800 min-h-screen flex flex-col justify-between items-center font-sans transition-colors duration-500 selection:bg-rose-500 selection:text-white p-4 sm:p-6";
                }
                sunIcon.classList.toggle('hidden', !state.isDark);
                moonIcon.classList.toggle('hidden', state.isDark);
                updateDisplay();
            });

            // Settings Modal
            settingsBtn.addEventListener('click', () => {
                inputFocus.value = state.durations.focus / 60;
                inputShort.value = state.durations.short / 60;
                inputLong.value = state.durations.long / 60;
                settingsModal.classList.remove('opacity-0', 'pointer-events-none');
            });

            closeSettingsBtn.addEventListener('click', () => {
                settingsModal.classList.add('opacity-0', 'pointer-events-none');
            });

            saveSettingsBtn.addEventListener('click', () => {
                state.durations.focus = Math.max(1, parseInt(inputFocus.value) || 25) * 60;
                state.durations.short = Math.max(1, parseInt(inputShort.value) || 5) * 60;
                state.durations.long = Math.max(1, parseInt(inputLong.value) || 15) * 60;

                state.timeLeft = state.durations[state.currentMode];
                pauseTimer();
                updateDisplay();
                settingsModal.classList.add('opacity-0', 'pointer-events-none');
            });

            // Keyboard Shortcuts
            window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return; // Ignore when typing in settings inputs
                if (e.code === 'Space') {
                    e.preventDefault();
                    toggleTimer();
                } else if (e.key === 'r' || e.key === 'R') {
                    resetTimer();
                } else if (e.key === 's' || e.key === 'R') {
                    skipBtn.click();
                }
            });
        }

        // Initialize App on load
        window.onload = init;
    </script>
</body>
</html>
